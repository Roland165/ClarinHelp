[project]
name = "clarinhelp"
version = "0.1.0"
description = "Offline training and evaluation for ClarinHelp (pitch, transcription, score following, piece recognition)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "mir-eval>=0.8.2",
    "music21>=10.5.2",
    "numpy>=2.0",
    "soundfile>=0.14.0",
    "torch>=2.15.0",
    "torchcrepe>=0.0.24",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=8",
    "ruff>=0.8",
]

# CPU-only PyTorch everywhere: no GPU here, and the default Linux wheels bundle CUDA (GBs).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clarinhelp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
